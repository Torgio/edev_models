# Ruta HTTPS del estudio de instalación aislado. Este fichero se incluye dentro del
# server HTTPS de vps-16d0afbc.vps.ovh.net. El servicio 8011 debe conservar:
# TFM_TEST_DB_NAME=tfm_energia_test y TFM_EMAIL=snapshot-test@local.invalid.

location = /api/bat-test/estudio {
    auth_request /_auth_tfm;

    limit_req zone=tfm_estudio burst=3 nodelay;
    client_max_body_size 12m;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:8011/api/bat/estudio;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /api/bat-test/ {
    auth_request /_auth_tfm;

    limit_req zone=tfm_general burst=30 nodelay;
    client_max_body_size 12m;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:8011/api/bat/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
