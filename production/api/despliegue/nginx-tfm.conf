# Publicar el estudio de bateria reutilizando el login que ya tiene Pulso Energia.
#
# Va DENTRO del `server { }` que ya sirve el sitio -- no es un fichero de sitio completo:
#
#     sudo cp production/api/despliegue/nginx-tfm.conf /etc/nginx/snippets/
#     # y en el server que corresponda:  include snippets/nginx-tfm.conf;
#     sudo nginx -t && sudo systemctl reload nginx
#
# ══════════════════════════════════════════════════════════════════════════════
#  POR QUE ASI Y NO CON UNA CONTRASEÑA APARTE
#
#  `pulso-api` ya tiene login de equipo, y su middleware rechaza con 401 cualquier ruta
#  que no sea `/session`, `/login` o `/logout`. Asi que nginx puede PREGUNTARLE si la
#  sesion vale antes de dejar pasar al API del TFM: `auth_request`.
#
#  No se toca el codigo de ninguno de los dos proyectos, y el equipo entra con la
#  contraseña que ya tiene. Una contraseña mas seria una contraseña mas que recordar y
#  otro sitio donde revocar el acceso de alguien que se va.
#
#  SE PREGUNTA A `/health`, NO A `/session`. `/session` es publica y devuelve SIEMPRE 200,
#  con el resultado en el cuerpo (`{"authenticated": false}`), y `auth_request` solo mira
#  el codigo de estado: daria por buena a cualquiera. `/health` esta detras del middleware
#  y devuelve 401 sin cookie y 200 con ella, que es exactamente el contrato que hace falta.
#
#  LA COOKIE ES `samesite=strict` Y `secure`. Esto solo funciona si la pantalla se sirve
#  desde el MISMO dominio que la web de Magui y por HTTPS. En otro dominio el navegador no
#  manda la cookie y no entra nadie, aunque haya iniciado sesion.
#
#  LO QUE ESTO NO RESUELVE: su sesion no lleva IDENTIDAD. Es una contraseña de equipo, y
#  el cuerpo firmado es `{iat, exp, nonce}`, sin usuario. Entra el equipo y nadie mas
#  --que es la parte importante-- pero el API del TFM sigue sin saber cual de vosotros es,
#  y todos comparten las mismas instalaciones bajo `TFM_EMAIL`. Para un TFM de cuatro
#  personas es asumible; conviene que este dicho.
# ══════════════════════════════════════════════════════════════════════════════


# ── el guardian ──────────────────────────────────────────────────────────────
# `internal` significa que nadie puede pedir esta ruta desde fuera: solo existe para las
# subpeticiones de `auth_request`. Sin ella, cualquiera podria llamarla directamente.
location = /_auth_tfm {
    internal;
    proxy_pass              http://127.0.0.1:8000/health;
    proxy_pass_request_body off;                 # al guardian no le hace falta el cuerpo
    proxy_set_header        Content-Length "";
    proxy_set_header        X-Original-URI $request_uri;
}

# EL FORMULARIO DE ENTRADA, y va SIN `auth_request` -- si lo llevara, para entrar
# habria que estar dentro.
#
# `=` es coincidencia exacta y gana a cualquier prefijo, asi que esta unica ruta queda
# abierta y todo lo demas de /bateria/ sigue protegido.
#
# Existe porque `pulso-api` no sirve ni un HTML: es un API puro, y su cookie es
# `samesite=strict`, asi que solo vale desde ESTE dominio. Sin esta pagina, quien no
# tenia sesion veia el 401 en crudo -- `{"detail":"Inicia sesion..."}` -- que no es una
# pantalla de login. Cuando Magui despliegue su front aqui, esto sobra.
location = /bateria/entrar.html {
    proxy_pass http://127.0.0.1:8010/bateria/entrar.html;
    proxy_set_header Host $host;
}

# A donde va quien no ha iniciado sesion. Se lleva `next` para devolverlo despues a
# donde queria ir, en vez de dejarlo siempre en la portada.
location @sin_sesion {
    return 302 /bateria/entrar.html?next=$request_uri;
}


# ── la pantalla del estudio ──────────────────────────────────────────────────
location /bateria/ {
    auth_request /_auth_tfm;
    error_page 401 403 = @sin_sesion;

    limit_req zone=tfm_general burst=20 nodelay;
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /plantillas/ {
    auth_request /_auth_tfm;
    error_page 401 403 = @sin_sesion;
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host $host;
}


# ── lanzar un estudio: el unico caro ─────────────────────────────────────────
# Se separa del resto porque es el que hay que limitar de verdad: cada uno son cuatro
# minutos de CPU en el mismo VPS donde corren la ingesta y la prediccion diaria.
# Seis por minuto y direccion es de sobra para trabajar y no da para tumbar nada.
location /api/bat/estudio {
    auth_request /_auth_tfm;
    error_page 401 403 = @sin_sesion;

    limit_req zone=tfm_estudio burst=3 nodelay;
    client_max_body_size 25m;
    proxy_read_timeout   120s;
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host            $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}


# ── el resto del API de bateria ──────────────────────────────────────────────
location /api/bat/ {
    auth_request /_auth_tfm;
    error_page 401 403 = @sin_sesion;

    limit_req zone=tfm_general burst=30 nodelay;
    client_max_body_size 25m;                    # los Excel de un año pesan
    proxy_read_timeout   60s;
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host            $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}


# ══════════════════════════════════════════════════════════════════════════════
#  DOS COSAS QUE VAN FUERA DE ESTE FICHERO
#
#  1 · Las zonas del limitador van en el bloque `http { }`, no aqui:
#
#        limit_req_zone $binary_remote_addr zone=tfm_estudio:1m rate=6r/m;
#        limit_req_zone $binary_remote_addr zone=tfm_general:1m rate=120r/m;
#
#  2 · NO SE ENRUTA `/` HACIA EL 8010. `production/api/main.py` monta los estaticos del
#      panel de predicciones en la raiz, asi que hacerlo se comeria el sitio entero,
#      `pulso-api` incluido. Aqui solo se publican `/bateria/`, `/plantillas/` y
#      `/api/bat/`, que es lo del estudio de bateria y nada mas.
# ══════════════════════════════════════════════════════════════════════════════
